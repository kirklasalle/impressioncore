name: Shim Auto Removal PR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  auto-remove-shims:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run guard (json only)
        run: |
          python -m dev_tools.ci.root_script_guard --fail-on-duplicates --json-report guard_report.json --shim-grace-days ${STRUCTURE_SHIM_GRACE_DAYS:-30} --enforce-expired || true

      - name: Generate removal branch
        id: gen
        run: |
          if [ ! -f guard_report.json ]; then echo "no report"; exit 0; fi
          expired=$(jq -r '.removal_suggestions | length' guard_report.json)
          if [ "$expired" = "0" ]; then echo "no expired"; exit 0; fi
          branch="chore/remove-expired-shims-$(date +%Y%m%d)"
          echo "branch_name=$branch" >> $GITHUB_OUTPUT
          git checkout -b "$branch"
          # Remove each expired shim file
          jq -r '.removal_suggestions[]' guard_report.json > removals.txt
          while IFS= read -r line; do file=$(echo "$line" | awk '{print $3}'); if [ -f "$file" ]; then git rm "$file"; fi; done < removals.txt
          # Update relocation_plan statuses
          today=$(date +"%B %e, %Y" | sed 's/  / /')
          perl -0777 -pi -e "s/done \(shim phase; created ([^)]+)\)/retired (removed $today)/g" src/core/management/relocation_plan.md
          git add src/core/management/relocation_plan.md || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: retire expired shims"
          git push origin "$branch"

      - name: Open PR
        if: steps.gen.outputs.branch_name
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = process.env.BRANCH_NAME || core.getInput('branch_name') || '${{ steps.gen.outputs.branch_name }}';
            const report = JSON.parse(fs.readFileSync('guard_report.json','utf8'));
            const bodyLines = [
              'Automated removal of expired shims.',
              '',
              'Removed shim files:',
              ...report.removal_suggestions.map(s=>' - '+s),
              '',
              'Relocation plan statuses updated to retired.',
              'Generated by shim-auto-removal workflow.'
            ];
            const body = bodyLines.join('\n');
            const {owner, repo} = context.repo;
            const title = 'chore: retire expired shims';
            // Avoid duplicate PR
            const {data: prs} = await github.rest.pulls.list({owner, repo, state:'open', per_page:50});
            if (prs.find(p=>p.title === title)) { core.info('PR already open'); return; }
            await github.rest.pulls.create({owner, repo, title, head: branch, base: 'main', body});
        env:
          BRANCH_NAME: ${{ steps.gen.outputs.branch_name }}