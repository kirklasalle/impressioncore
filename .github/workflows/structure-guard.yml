name: Root Structure Guard

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/*.py'
      - 'src/core/management/relocation_plan.md'
      - 'src/dev_tools/ci/root_script_guard.py'
      - '.github/workflows/structure-guard.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/*.py'
      - 'src/core/management/relocation_plan.md'
      - 'src/dev_tools/ci/root_script_guard.py'
      - '.github/workflows/structure-guard.yml'

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run root script guard
        run: |
          python -m dev_tools.ci.root_script_guard --fail-on-duplicates

      - name: Run guard pytest (redundancy check)
        run: |
          if [ -d src/tests ]; then python -m pytest -k root_script_guard -q; fi

      - name: Summary
        if: always()
        run: echo "Root structure guard workflow completed." 
