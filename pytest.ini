[pytest]
asyncio_mode = auto
addopts = -ra
testpaths = src/tests
norecursedirs = 
    .* 
    build 
    dist 
    logs 
    archive 
    deployment 
    src/deployment 
    src/archive 
    src/logs 
    src/dev_tools/tests/multimodal/.. 
python_files = test_*.py *_test.py
filterwarnings = 
    ignore:invalid escape sequence:SyntaxWarning
    ignore:invalid escape sequence:DeprecationWarning
    ignore:asyncio_default_fixture_loop_scope
    ignore:.*numpy\.core\._multiarray_umath.*:DeprecationWarning:faiss.loader
    ignore::pytest.PytestReturnNotNoneWarning
    ignore:pkg_resources is deprecated:UserWarning
    ignore:`eval` package is deprecated:DeprecationWarning
    ignore:MemoryManager .* is renamed:DeprecationWarning
    ignore:Could not detect VRAM:UserWarning
    ignore:Even with quantization:UserWarning
    ignore:cannot collect test class:pytest.PytestCollectionWarning
    ignore:Import from evaluation:DeprecationWarning
    ignore:Use shutil.which:DeprecationWarning
    ignore:Passing .gradient_checkpointing.:UserWarning
