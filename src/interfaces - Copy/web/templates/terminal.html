{% extends "base.html" %}

{% block title %}Terminal{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h1>Terminal</h1>
            <div id="terminal"></div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const terminalElement = document.getElementById('terminal');
        const term = new Terminal();

        term.open(terminalElement);
        term.write('Connecting to WebSocket...\r\n');

        const ws = new WebSocket('ws://' + window.location.host + '/ws/terminal');

        ws.onopen = function (event) {
            term.write('WebSocket connection established.\r\n');
        };

        ws.onmessage = function (event) {
            term.write(event.data);
        };

        ws.onerror = function (event) {
            term.write('WebSocket connection error.\r\n');
        };

        ws.onclose = function (event) {
            term.write('WebSocket connection closed.\r\n');
        };
    });
</script>
{% endblock %}
