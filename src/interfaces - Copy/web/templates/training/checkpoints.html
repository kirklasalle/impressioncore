{% extends "base.html" %}

{% block title %}Checkpoint Management - ImpressionCore{% endblock %}

{% block head %}
{{ super() }}
<style>
.checkpoint-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
    padding: 1rem;
}
.checkpoint-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 1rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}
.checkpoint-card h3 {
    margin-top: 0;
    color: #4CAF50;
}
.metric-value {
    font-family: monospace;
    color: #8BC34A;
}
.checkpoint-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
}
.btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s;
}
.btn-primary {
    background: #4CAF50;
    color: white;
}
.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #4CAF50;
}
.btn:hover {
    filter: brightness(1.1);
}
.metrics-list {
    margin: 0.5rem 0;
    padding: 0;
    list-style: none;
}
.metrics-list li {
    display: flex;
    justify-content: space-between;
    padding: 0.25rem 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h1>Checkpoint Management</h1>
    
    <div class="actions">
        <button class="btn btn-primary" onclick="refreshCheckpoints()">Refresh List</button>
    </div>
    
    <div class="checkpoint-grid" id="checkpoints-container">
        <!-- Checkpoint cards will be inserted here -->
    </div>
</div>

<script>
async function refreshCheckpoints() {
    const response = await fetch('/training/api/checkpoints');
    const checkpoints = await response.json();
    
    const container = document.getElementById('checkpoints-container');
    container.innerHTML = '';
    
    checkpoints.forEach(checkpoint => {
        const card = createCheckpointCard(checkpoint);
        container.appendChild(card);
    });
}

function createCheckpointCard(checkpoint) {
    const card = document.createElement('div');
    card.className = 'checkpoint-card';
    
    const metrics = checkpoint.metrics || {};
    
    card.innerHTML = `
        <h3>${checkpoint.name}</h3>
        <p>Step: <span class="metric-value">${checkpoint.global_step}</span></p>
        <ul class="metrics-list">
            <li>
                <span>Training Loss</span>
                <span class="metric-value">${metrics.train_loss?.toFixed(4) || 'N/A'}</span>
            </li>
            <li>
                <span>Validation Loss</span>
                <span class="metric-value">${metrics.val_loss?.toFixed(4) || 'N/A'}</span>
            </li>
            <li>
                <span>Learning Rate</span>
                <span class="metric-value">${metrics.learning_rate?.toExponential(2) || 'N/A'}</span>
            </li>
        </ul>
        <div class="checkpoint-actions">
            <button class="btn btn-primary" onclick="loadCheckpoint('${checkpoint.path}')">
                Load
            </button>
            <button class="btn btn-secondary" onclick="deleteCheckpoint('${checkpoint.path}')">
                Delete
            </button>
        </div>
    `;
    
    return card;
}

async function loadCheckpoint(path) {
    try {
        const response = await fetch('/training/api/checkpoints/load', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path })
        });
        
        if (response.ok) {
            alert('Checkpoint loaded successfully');
        } else {
            throw new Error('Failed to load checkpoint');
        }
    } catch (error) {
        alert('Error loading checkpoint: ' + error.message);
    }
}

async function deleteCheckpoint(path) {
    if (!confirm('Are you sure you want to delete this checkpoint?')) {
        return;
    }
    
    try {
        const response = await fetch('/training/api/checkpoints/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path })
        });
        
        if (response.ok) {
            refreshCheckpoints();
        } else {
            throw new Error('Failed to delete checkpoint');
        }
    } catch (error) {
        alert('Error deleting checkpoint: ' + error.message);
    }
}

// Load checkpoints on page load
document.addEventListener('DOMContentLoaded', refreshCheckpoints);
</script>
{% endblock %}
