{% extends "base.html" %}

{% block title %}Model Architecture - ImpressionCore{% endblock %}

{% block head %}
{{ super() }}
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
.architecture-container {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 1rem;
    padding: 1rem;
    height: calc(100vh - 100px);
}
.sidebar {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 1rem;
    overflow-y: auto;
}
.main-view {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 1rem;
    overflow: hidden;
}
.layer-list {
    list-style: none;
    padding: 0;
    margin: 0;
}
.layer-item {
    padding: 0.5rem;
    margin-bottom: 0.5rem;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s;
}
.layer-item:hover {
    background: rgba(255, 255, 255, 0.1);
}
.layer-item.selected {
    background: rgba(76, 175, 80, 0.2);
    border-left: 3px solid #4CAF50;
}
.layer-details {
    font-size: 0.9em;
    margin-top: 0.5rem;
    padding-left: 1rem;
    border-left: 2px solid rgba(255, 255, 255, 0.1);
}
.param-count {
    font-family: monospace;
    color: #8BC34A;
}
.architecture-controls {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
}
.zoom-controls {
    display: flex;
    gap: 0.5rem;
}
.btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    transition: background-color 0.2s;
}
.btn:hover {
    background: rgba(255, 255, 255, 0.2);
}
#architecture-svg {
    width: 100%;
    height: calc(100% - 50px);
    overflow: auto;
}
.node {
    fill: #4CAF50;
    stroke: white;
    stroke-width: 2px;
}
.edge {
    stroke: rgba(255, 255, 255, 0.3);
    stroke-width: 2px;
}
.node-label {
    fill: white;
    font-size: 12px;
    text-anchor: middle;
    pointer-events: none;
}
</style>
{% endblock %}

{% block content %}
<div class="architecture-container">
    <div class="sidebar">
        <h2>Model Layers</h2>
        <div class="layer-list" id="layer-list">
            <!-- Layer items will be inserted here -->
        </div>
    </div>
    
    <div class="main-view">
        <div class="architecture-controls">
            <div class="zoom-controls">
                <button class="btn" onclick="zoomIn()">+</button>
                <button class="btn" onclick="zoomOut()">-</button>
                <button class="btn" onclick="resetZoom()">Reset</button>
            </div>
            <button class="btn" onclick="toggleLayout()">Toggle Layout</button>
        </div>
        
        <div id="architecture-svg"></div>
    </div>
</div>

<script>
let currentZoom = 1;
let layoutType = 'vertical';
let networkData = null;

async function loadArchitecture() {
    const response = await fetch('/training/api/architecture');
    networkData = await response.json();
    
    renderLayerList(networkData.layers);
    renderArchitecture(networkData);
}

function renderLayerList(layers) {
    const container = document.getElementById('layer-list');
    container.innerHTML = '';
    
    layers.forEach(layer => {
        const item = document.createElement('div');
        item.className = 'layer-item';
        item.innerHTML = `
            <strong>${layer.name}</strong>
            <div class="layer-details">
                <div>Type: ${layer.type}</div>
                <div>Parameters: <span class="param-count">${layer.parameters.toLocaleString()}</span></div>
                ${layer.shape ? `<div>Shape: ${layer.shape.join(' × ')}</div>` : ''}
            </div>
        `;
        
        item.onclick = () => highlightLayer(layer.id);
        container.appendChild(item);
    });
}

function renderArchitecture(data) {
    const container = document.getElementById('architecture-svg');
    container.innerHTML = '';
    
    const width = container.clientWidth;
    const height = container.clientHeight;
    
    const svg = d3.select('#architecture-svg')
        .append('svg')
        .attr('width', width)
        .attr('height', height);
        
    const g = svg.append('g');
    
    // Create force simulation
    const simulation = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.edges).id(d => d.id))
        .force('charge', d3.forceManyBody().strength(-500))
        .force('center', d3.forceCenter(width / 2, height / 2));
        
    // Draw edges
    const edges = g.selectAll('line')
        .data(data.edges)
        .enter()
        .append('line')
        .attr('class', 'edge');
        
    // Draw nodes
    const nodes = g.selectAll('circle')
        .data(data.nodes)
        .enter()
        .append('circle')
        .attr('class', 'node')
        .attr('r', 20)
        .call(d3.drag()
            .on('start', dragstarted)
            .on('drag', dragged)
            .on('end', dragended));
            
    // Add labels
    const labels = g.selectAll('text')
        .data(data.nodes)
        .enter()
        .append('text')
        .attr('class', 'node-label')
        .text(d => d.name);
        
    // Update positions
    simulation.on('tick', () => {
        edges
            .attr('x1', d => d.source.x)
            .attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x)
            .attr('y2', d => d.target.y);
            
        nodes
            .attr('cx', d => d.x)
            .attr('cy', d => d.y);
            
        labels
            .attr('x', d => d.x)
            .attr('y', d => d.y + 30);
    });
    
    function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
    }
    
    function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
    }
    
    function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
    }
}

function highlightLayer(layerId) {
    const items = document.querySelectorAll('.layer-item');
    items.forEach(item => item.classList.remove('selected'));
    
    const selectedItem = Array.from(items)
        .find(item => item.querySelector('strong').textContent === layerId);
    if (selectedItem) {
        selectedItem.classList.add('selected');
        selectedItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    // Highlight corresponding node in visualization
    d3.selectAll('.node')
        .style('fill', d => d.id === layerId ? '#8BC34A' : '#4CAF50')
        .style('stroke-width', d => d.id === layerId ? '3px' : '2px');
}

function zoomIn() {
    currentZoom *= 1.2;
    updateZoom();
}

function zoomOut() {
    currentZoom /= 1.2;
    updateZoom();
}

function resetZoom() {
    currentZoom = 1;
    updateZoom();
}

function updateZoom() {
    const container = document.getElementById('architecture-svg');
    const svg = container.querySelector('svg g');
    svg.style.transform = `scale(${currentZoom})`;
}

function toggleLayout() {
    layoutType = layoutType === 'vertical' ? 'radial' : 'vertical';
    if (networkData) {
        renderArchitecture(networkData);
    }
}

// Load architecture on page load
document.addEventListener('DOMContentLoaded', loadArchitecture);

// Handle window resize
window.addEventListener('resize', () => {
    if (networkData) {
        renderArchitecture(networkData);
    }
});
</script>
{% endblock %}
