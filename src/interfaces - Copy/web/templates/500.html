{% extends "base.html" %}

{% block title %}500 Server Error - ImpressionCore{% endblock %}

{% block content %}
<div class="error-container">
    <div class="card error-card">
        <div class="error-code">500</div>
        <div class="error-title">Server Error</div>
        <div class="error-message">Something went wrong on our end. Please try again later.</div>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Go Home
            </a>
            <button onclick="location.reload()" class="btn btn-secondary">
                <i class="fas fa-redo"></i>
                Try Again
            </button>
        </div>
    </div>
</div>

<style>
    .error-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 2rem);
        padding: 1rem;
    }

    .error-card {
        text-align: center;
        padding: 3rem 2rem;
        max-width: 500px;
    }

    .error-code {
        font-size: 6rem;
        font-weight: bold;
        color: var(--accent-color);
        line-height: 1;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #dc3545, #ff4757);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .error-title {
        font-size: 1.5rem;
        color: var(--text-primary);
        margin-bottom: 1rem;
    }

    .error-message {
        color: var(--text-secondary);
        margin-bottom: 2rem;
    }

    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
    }
</style>
{% endblock %}
