{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Model Training Monitoring</h1>
    
    <div class="monitoring-panel">
        <!-- Training Progress -->
        <div class="card">
            <div class="card-header">
                <h2>Training Progress</h2>
            </div>
            <div class="card-body">
                <div class="metric">
                    <span class="label">Epoch:</span>
                    <span class="value" id="epoch">-</span>
                </div>
                <div class="metric">
                    <span class="label">Step:</span>
                    <span class="value" id="step">-</span>
                </div>
                <div class="metric">
                    <span class="label">Loss:</span>
                    <span class="value" id="loss">-</span>
                </div>
                <div class="metric">
                    <span class="label">Accuracy:</span>
                    <span class="value" id="accuracy">-</span>
                </div>
                <div class="metric">
                    <span class="label">Learning Rate:</span>
                    <span class="value" id="learning-rate">-</span>
                </div>
            </div>
        </div>

        <!-- Resource Usage -->
        <div class="card">
            <div class="card-header">
                <h2>Resource Usage</h2>
            </div>
            <div class="card-body">
                <div class="metric">
                    <span class="label">GPU Memory:</span>
                    <div class="progress">
                        <div id="gpu-memory-bar" class="progress-bar" role="progressbar"></div>
                    </div>
                    <span class="value" id="gpu-memory">-</span>
                </div>
                <div class="metric">
                    <span class="label">CPU Usage:</span>
                    <div class="progress">
                        <div id="cpu-bar" class="progress-bar" role="progressbar"></div>
                    </div>
                    <span class="value" id="cpu-percent">-</span>
                </div>
                <div class="metric">
                    <span class="label">Memory Usage:</span>
                    <div class="progress">
                        <div id="memory-bar" class="progress-bar" role="progressbar"></div>
                    </div>
                    <span class="value" id="memory-percent">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <button id="pause-training" class="btn btn-warning">Pause Training</button>
        <button id="resume-training" class="btn btn-success" disabled>Resume Training</button>
        <button id="stop-training" class="btn btn-danger">Stop Training</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/monitoring.js') }}"></script>
{% endblock %}
