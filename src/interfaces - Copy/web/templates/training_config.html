<!DOCTYPE html>
<html>
<head>
    <title>Training Configuration</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <a href="/unified_builder" class="nav-link">← Back to Builder</a>
            <span class="nav-title">Training Configuration</span>
            <a href="/docs" class="nav-link">Documentation</a>
        </nav>

        <form id="training-form" class="config-form">
            <div class="form-section">
                <h2>Training Parameters</h2>
                <div class="form-group">
                    <label for="batch_size">Batch Size:</label>
                    <input type="number" id="batch_size" name="batch_size" min="1" value="32">
                </div>
                <div class="form-group">
                    <label for="epochs">Number of Epochs:</label>
                    <input type="number" id="epochs" name="epochs" min="1" value="10">
                </div>
                <div class="form-group">
                    <label for="learning_rate">Learning Rate:</label>
                    <input type="number" id="learning_rate" name="learning_rate" step="0.0001" value="0.001">
                </div>
            </div>

            <div class="form-section">
                <h2>Data Pipeline</h2>
                <div class="form-group">
                    <label for="data_path">Dataset Path:</label>
                    <input type="text" id="data_path" name="data_path">
                </div>
                <div class="form-group">
                    <label for="validation_split">Validation Split:</label>
                    <input type="number" id="validation_split" name="validation_split" min="0" max="1" step="0.1" value="0.2">
                </div>
            </div>

            <div class="form-section">
                <h2>Hardware Configuration</h2>
                <div class="form-group">
                    <label for="device">Training Device:</label>
                    <select id="device" name="device">
                        <option value="cuda">GPU (CUDA)</option>
                        <option value="cpu">CPU</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="num_workers">Number of Workers:</label>
                    <input type="number" id="num_workers" name="num_workers" min="1" value="4">
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="primary-button">Save Configuration</button>
                <button type="button" class="secondary-button" onclick="window.location.href='/unified_builder'">Cancel</button>
            </div>
        </form>

        <div id="status-message" class="status-message"></div>
    </div>
    <script src="/static/js/training_config.js"></script>
</body>
</html>
