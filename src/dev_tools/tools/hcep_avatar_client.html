<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCEP Avatar Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 25px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            transition: background 0.3s;
        }
        
        .status-dot.connected {
            background: #44ff44;
            box-shadow: 0 0 10px #44ff44;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Avatar Face Display */
        .avatar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            position: relative;
        }
        
        .avatar-face {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border-radius: 50%;
            position: relative;
            border: 3px solid #00d4ff;
            transition: transform 0.2s ease-out;
        }
        
        .avatar-eye {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            top: 70px;
            transition: all 0.15s ease-out;
        }
        
        .avatar-eye.left {
            left: 45px;
        }
        
        .avatar-eye.right {
            right: 45px;
        }
        
        .avatar-pupil {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #1a1a2e;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease-out;
        }
        
        .avatar-mouth {
            position: absolute;
            width: 60px;
            height: 20px;
            background: transparent;
            border-bottom: 4px solid #fff;
            border-radius: 0 0 30px 30px;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Gaze Indicator */
        .gaze-indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .gaze-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ff6b6b);
            transform-origin: left center;
            opacity: 0.7;
        }
        
        /* State Display */
        .state-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .state-item {
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            text-align: center;
        }
        
        .state-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }
        
        .state-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .state-value.positive {
            color: #44ff88;
        }
        
        .state-value.negative {
            color: #ff6b6b;
        }
        
        /* Pose Data */
        .pose-bars {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .pose-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .pose-label {
            width: 60px;
            font-size: 0.9rem;
            color: #888;
        }
        
        .pose-track {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .pose-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #7b2ff7, #00d4ff);
            border-radius: 4px;
            transition: all 0.15s ease-out;
        }
        
        .pose-value {
            width: 50px;
            text-align: right;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        /* Log */
        .log-container {
            height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
        }
        
        .log-entry.hcep {
            background: rgba(0, 212, 255, 0.1);
        }
        
        .log-entry.skeleton {
            background: rgba(123, 47, 247, 0.1);
        }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button.primary {
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            color: white;
        }
        
        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }
        
        button.secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 HCEP Avatar Test Client</h1>
            <p class="subtitle">Human Conversation Eye Points - Real-time Visualization</p>
        </header>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <div class="status-item">
                <span>Identity: </span>
                <strong id="identityText">—</strong>
            </div>
            <div class="status-item">
                <span>FPS: </span>
                <strong id="fpsText">0</strong>
            </div>
        </div>
        
        <div class="main-grid">
            <!-- Avatar Visualization -->
            <div class="card">
                <h2>👤 Avatar Eye Tracking</h2>
                <div class="avatar-container">
                    <div class="avatar-face" id="avatarFace">
                        <div class="avatar-eye left">
                            <div class="avatar-pupil" id="pupilLeft"></div>
                        </div>
                        <div class="avatar-eye right">
                            <div class="avatar-pupil" id="pupilRight"></div>
                        </div>
                        <div class="avatar-mouth"></div>
                    </div>
                    <div class="gaze-indicator">
                        <div class="gaze-arrow" id="gazeArrow"></div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="primary" id="connectBtn" onclick="toggleConnection()">Connect</button>
                    <button class="secondary" onclick="clearLog()">Clear Log</button>
                </div>
            </div>
            
            <!-- State Display -->
            <div class="card">
                <h2>🧠 Cognitive State</h2>
                <div class="state-grid">
                    <div class="state-item">
                        <div class="state-label">Gaze Region</div>
                        <div class="state-value" id="gazeRegion">—</div>
                    </div>
                    <div class="state-item">
                        <div class="state-label">Cognitive State</div>
                        <div class="state-value" id="cognitiveState">—</div>
                    </div>
                    <div class="state-item">
                        <div class="state-label">Valence</div>
                        <div class="state-value" id="valence">—</div>
                    </div>
                    <div class="state-item">
                        <div class="state-label">Confidence</div>
                        <div class="state-value" id="confidence">—</div>
                    </div>
                </div>
                
                <h2 style="margin-top: 25px;">📐 Head Pose</h2>
                <div class="pose-bars">
                    <div class="pose-bar">
                        <span class="pose-label">Pitch</span>
                        <div class="pose-track">
                            <div class="pose-fill" id="pitchBar" style="width: 50%; left: 25%;"></div>
                        </div>
                        <span class="pose-value" id="pitchValue">0°</span>
                    </div>
                    <div class="pose-bar">
                        <span class="pose-label">Yaw</span>
                        <div class="pose-track">
                            <div class="pose-fill" id="yawBar" style="width: 50%; left: 25%;"></div>
                        </div>
                        <span class="pose-value" id="yawValue">0°</span>
                    </div>
                    <div class="pose-bar">
                        <span class="pose-label">Roll</span>
                        <div class="pose-track">
                            <div class="pose-fill" id="rollBar" style="width: 50%; left: 25%;"></div>
                        </div>
                        <span class="pose-value" id="rollValue">0°</span>
                    </div>
                </div>
            </div>
            
            <!-- Log -->
            <div class="card" style="grid-column: span 2;">
                <h2>📋 Event Log</h2>
                <div class="log-container" id="logContainer"></div>
            </div>
        </div>
    </div>
    
    <script>
        // WebSocket connection
        let ws = null;
        let connected = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        
        const WS_URL = 'ws://localhost:8765';
        
        function toggleConnection() {
            if (connected) {
                disconnect();
            } else {
                connect();
            }
        }
        
        function connect() {
            log('Connecting to ' + WS_URL + '...');
            
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    connected = true;
                    updateStatus(true);
                    log('Connected!', 'success');
                    document.getElementById('connectBtn').textContent = 'Disconnect';
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                    frameCount++;
                };
                
                ws.onclose = () => {
                    connected = false;
                    updateStatus(false);
                    log('Disconnected', 'error');
                    document.getElementById('connectBtn').textContent = 'Connect';
                };
                
                ws.onerror = (error) => {
                    log('Connection error. Is the server running?', 'error');
                };
            } catch (e) {
                log('Failed to connect: ' + e.message, 'error');
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function handleMessage(data) {
            if (data.type === 'hcep') {
                updateHCEP(data);
            } else if (data.type === 'skeleton') {
                // updateSkeleton(data);
            } else if (data.type === 'connected') {
                log('Server: ' + data.message);
            }
        }
        
        function updateHCEP(data) {
            // Update identity
            document.getElementById('identityText').textContent = data.identity;
            
            // Update gaze region
            document.getElementById('gazeRegion').textContent = data.gaze.region;
            
            // Update cognitive state
            const stateEl = document.getElementById('cognitiveState');
            stateEl.textContent = data.state.cognitive;
            
            // Update valence with color
            const valenceEl = document.getElementById('valence');
            valenceEl.textContent = data.state.valence;
            valenceEl.className = 'state-value ' + data.state.valence.toLowerCase();
            
            // Update confidence
            const conf = (data.state.confidence * 100).toFixed(0);
            document.getElementById('confidence').textContent = conf + '%';
            
            // Update pose bars
            updatePoseBar('pitch', data.gaze.pitch);
            updatePoseBar('yaw', data.gaze.yaw);
            updatePoseBar('roll', data.gaze.roll || 0);
            
            // Update avatar
            updateAvatar(data.gaze.pitch, data.gaze.yaw, data.gaze.roll || 0);
            
            // Log significant changes (throttled)
            if (Math.random() < 0.1) {
                log(`${data.identity}: ${data.gaze.region} → ${data.state.cognitive}`, 'hcep');
            }
        }
        
        function updatePoseBar(name, value) {
            const maxAngle = 30;
            const normalized = Math.max(-maxAngle, Math.min(maxAngle, value));
            const percent = ((normalized + maxAngle) / (maxAngle * 2)) * 100;
            
            const bar = document.getElementById(name + 'Bar');
            bar.style.left = '0%';
            bar.style.width = percent + '%';
            
            document.getElementById(name + 'Value').textContent = value.toFixed(1) + '°';
        }
        
        function updateAvatar(pitch, yaw, roll) {
            // Move pupils based on gaze
            const maxMove = 8;
            const pupilX = (yaw / 30) * maxMove;
            const pupilY = (-pitch / 30) * maxMove;
            
            const pupils = [document.getElementById('pupilLeft'), document.getElementById('pupilRight')];
            pupils.forEach(p => {
                p.style.transform = `translate(calc(-50% + ${pupilX}px), calc(-50% + ${pupilY}px))`;
            });
            
            // Tilt face based on roll
            const face = document.getElementById('avatarFace');
            face.style.transform = `rotate(${roll}deg)`;
            
            // Update gaze arrow
            const arrow = document.getElementById('gazeArrow');
            const angle = Math.atan2(-pitch, yaw) * (180 / Math.PI);
            arrow.style.transform = `rotate(${angle}deg)`;
        }
        
        function updateStatus(isConnected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (isConnected) {
                dot.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }
        
        function log(message, type = '') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // Keep only last 100 entries
            while (container.children.length > 100) {
                container.removeChild(container.firstChild);
            }
        }
        
        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            log('Log cleared');
        }
        
        // FPS counter
        setInterval(() => {
            const now = Date.now();
            const elapsed = (now - lastFpsTime) / 1000;
            const fps = Math.round(frameCount / elapsed);
            
            document.getElementById('fpsText').textContent = fps;
            
            frameCount = 0;
            lastFpsTime = now;
        }, 1000);
        
        // Initial message
        log('HCEP Avatar Test Client ready');
        log('Click "Connect" to connect to the server');
    </script>
</body>
</html>
