<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImpressionCore Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user-message {
            background-color: #e3f2fd;
            border-radius: 10px;
            padding: 10px;
            margin: 5px 0;
            max-width: 80%;
            margin-left: auto;
            text-align: right;
        }

        .bot-message {
            background-color: #f5f5f5;
            border-radius: 10px;
            padding: 10px;
            margin: 5px 0;
            max-width: 80%;
        }

        .knowledge-container {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">ImpressionCore Demo</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h3>Chat Interface</h3>
                <div class="chat-container" id="chatContainer">
                    <div class="bot-message">
                        Hello! I'm ImpressionCore. How can I assist you today?
                    </div>
                </div>
                <div class="input-group">
                    <input type="text" id="userInput" class="form-control" placeholder="Type your message...">
                    <button class="btn btn-primary" id="sendButton">Send</button>
                </div>
            </div>

            <div class="col-md-4">
                <h3>Knowledge Management</h3>
                <div class="knowledge-container" id="knowledgeContainer">
                    <div>No knowledge facts queried yet.</div>
                </div>

                <div class="mt-3">
                    <h5>Add Knowledge</h5>
                    <div class="mb-2">
                        <input type="text" id="subjectInput" class="form-control" placeholder="Subject (e.g., Mars)">
                    </div>
                    <div class="mb-2">
                        <input type="text" id="predicateInput" class="form-control"
                            placeholder="Predicate (e.g., has_moons)">
                    </div>
                    <div class="mb-2">
                        <input type="text" id="objectInput" class="form-control" placeholder="Object Value (e.g., 2)">
                    </div>
                    <button class="btn btn-success" id="addKnowledgeButton">Add Fact</button>
                </div>

                <div class="mt-3">
                    <h5>Query Knowledge</h5>
                    <div class="input-group">
                        <input type="text" id="queryInput" class="form-control" placeholder="Subject to query">
                        <button class="btn btn-info" id="queryKnowledgeButton">Query</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const apiUrl = 'http://localhost:8000';
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const knowledgeContainer = document.getElementById('knowledgeContainer');
            const addKnowledgeButton = document.getElementById('addKnowledgeButton');
            const queryKnowledgeButton = document.getElementById('queryKnowledgeButton');

            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            addKnowledgeButton.addEventListener('click', addKnowledge);
            queryKnowledgeButton.addEventListener('click', queryKnowledge);

            function sendMessage() {
                const message = userInput.value.trim();
                if (message) {
                    // Add user message to chat
                    const userMessageDiv = document.createElement('div');
                    userMessageDiv.classList.add('user-message');
                    userMessageDiv.textContent = message;
                    chatContainer.appendChild(userMessageDiv);

                    // Clear input
                    userInput.value = '';

                    // Scroll to bottom
                    chatContainer.scrollTop = chatContainer.scrollHeight;

                    // Send to API
                    fetch(`${apiUrl}/query`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            text: message,
                            input_type: 'text'
                        })
                    })
                        .then(response => response.json())
                        .then(data => {
                            // Add bot response to chat
                            const botMessageDiv = document.createElement('div');
                            botMessageDiv.classList.add('bot-message');
                            botMessageDiv.textContent = data.response;
                            chatContainer.appendChild(botMessageDiv);

                            // Scroll to bottom
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            const errorDiv = document.createElement('div');
                            errorDiv.classList.add('bot-message');
                            errorDiv.textContent = 'Sorry, I encountered an error processing your request.';
                            chatContainer.appendChild(errorDiv);
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        });
                }
            }

            function addKnowledge() {
                const subject = document.getElementById('subjectInput').value.trim();
                const predicate = document.getElementById('predicateInput').value.trim();
                const objectValue = document.getElementById('objectInput').value.trim();

                if (subject && predicate && objectValue) {
                    // Convert objectValue to proper type if needed
                    let parsedObject = objectValue;
                    if (objectValue.toLowerCase() === 'true') {
                        parsedObject = true;
                    } else if (objectValue.toLowerCase() === 'false') {
                        parsedObject = false;
                    } else if (!isNaN(objectValue)) {
                        parsedObject = Number(objectValue);
                    }

                    // Send to API
                    fetch(`${apiUrl}/knowledge/add`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            subject: subject,
                            predicate: predicate,
                            object_value: parsedObject
                        })
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                alert('Knowledge fact added successfully!');
                                document.getElementById('subjectInput').value = '';
                                document.getElementById('predicateInput').value = '';
                                document.getElementById('objectInput').value = '';
                            } else {
                                alert('Failed to add knowledge fact.');
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Error adding knowledge fact.');
                        });
                } else {
                    alert('Please fill in all fields.');
                }
            }

            function queryKnowledge() {
                const query = document.getElementById('queryInput').value.trim();
                if (query) {
                    // Send to API
                    fetch(`${apiUrl}/knowledge/query/${encodeURIComponent(query)}`, {
                        method: 'GET'
                    })
                        .then(response => response.json())
                        .then(data => {
                            knowledgeContainer.innerHTML = '';

                            if (data.results && data.results.length > 0) {
                                data.results.forEach(result => {
                                    const resultDiv = document.createElement('div');
                                    resultDiv.classList.add('card', 'mb-2');

                                    let attributesHtml = '';
                                    for (const [key, value] of Object.entries(result.attributes)) {
                                        attributesHtml += `<li>${key}: ${value}</li>`;
                                    }

                                    resultDiv.innerHTML = `
                                    <div class="card-body">
                                        <h5 class="card-title">${result.label}</h5>
                                        <ul>
                                            ${attributesHtml}
                                        </ul>
                                    </div>
                                `;
                                    knowledgeContainer.appendChild(resultDiv);
                                });
                            } else {
                                knowledgeContainer.innerHTML = '<div>No results found.</div>';
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            knowledgeContainer.innerHTML = '<div>Error querying knowledge.</div>';
                        });
                } else {
                    alert('Please enter a query.');
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
