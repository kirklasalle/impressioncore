{% extends "base.html" %}

{% block title %}Service Unavailable - ImpressionCore{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="text-align: center; padding: 3rem;">
        <h1 class="section-title" style="color: var(--warning-color);">503 - Service Unavailable</h1>
        <p style="font-size: 1.2rem; color: var(--text-secondary);">Sorry, the service is temporarily unavailable.</p>
        <p>This might be due to maintenance or overload. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary" style="margin-top: 1.5rem;">
            <i class="fas fa-home"></i> Go to Homepage
        </a>
    </div>
</div>
{% endblock %}
