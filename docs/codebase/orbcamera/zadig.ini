# OrbOS Zadig Configuration
# ===========================
# This file configures Zadig for the Logitech Orbit MP camera.
# Place this file in the same directory as zadig.exe

[general]
# Start in advanced mode to see full device info
advanced_mode = true
# Keep running to verify installation
exit_on_success = false
# Show debug log for troubleshooting
log_level = 0

[device]
# List ALL devices including those with drivers already installed
list_all = true
# Include hubs to see full device tree
include_hubs = false
# Clean up device names
trim_whitespaces = true

[driver]
# Use libusbK driver (best compatibility with PyUSB)
# Options: WinUSB = 0, libusb0.sys = 1, libusbK.sys = 2
default_driver = 2
# Don't extract only - we want to install
extract_only = false

[security]
# Allow unsigned driver installation (needed for libusb)
# disable_cert_install_warning = false
